services:
  gesturex-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gesturex-system:latest
    container_name: gesturex_container
    ports:
      - "8501:8501"
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
